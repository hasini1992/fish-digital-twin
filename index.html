<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Fixed 3D Hotspots</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1100px; width: 100%; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; text-align: center; }
        .content { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 30px; }
        .fish-container { position: relative; width: 100%; height: 450px; background: #FFFFFF; border: 2px solid #e0e0e0; border-radius: 15px; }
        model-viewer { width: 100%; height: 100%; }

        /* --- 3D PINNED HOTSPOT STYLING --- */
        .Hotspot {
            background: transparent;
            border: none;
            pointer-events: none; /* Prevents the dot from blocking the mouse when you try to rotate */
        }
        
        .spot-indicator {
            border-radius: 50%;
            transition: opacity 0.8s ease, background-color 0.8s ease;
            opacity: 0; /* Hidden by default */
            filter: blur(8px);
        }
        
        /* The Glow effect */
        #bellySpot { width: 120px; height: 60px; transform: translate(-50%, -50%); }
        #eyeSpot { width: 30px; height: 30px; transform: translate(-50%, -50%); }

        .status-card { background: #f8f9fa; padding: 18px; border-radius: 10px; border-left: 5px solid #667eea; margin-bottom: 15px; }
        .metric { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .metric-value { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 Fish Digital Twin</h1>
            <p>Spoilage Monitoring - Surface Locked Hotspots</p>
        </div>

        <div id="mainContent" class="content">
            <div class="model-section">
                <div class="fish-container">
                    <model-viewer 
                        id="fishModel"
                        src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                        auto-rotate 
                        camera-controls 
                        shadow-intensity="0.6">
                        
                        <button class="Hotspot" slot="hotspot-belly" 
                            data-position="0.0m -0.05m 0.05m" 
                            data-normal="0m 0m 1m">
                            <div class="spot-indicator" id="bellySpot"></div>
                        </button>
                        
                        <button class="Hotspot" slot="hotspot-eye" 
                            data-position="0.22m 0.05m 0.02m" 
                            data-normal="1m 0m 0m">
                            <div class="spot-indicator" id="eyeSpot"></div>
                        </button>
                    </model-viewer>
                </div>
            </div>

            <div class="info-section">
                <div class="status-card">
                    <h2 id="fishId">WHOLE-FISH-001</h2>
                    <div class="metric"><span>Body Spoilage (ΔE)</span><span id="bodyVal" class="metric-value">--</span></div>
                    <div class="metric"><span>Eye Spoilage (ΔE)</span><span id="eyeVal" class="metric-value">--</span></div>
                </div>
                <p style="font-size: 0.8em; color: #666; padding: 10px;">
                    Note: If the spots aren't visible, rotate the fish. They are pinned to the surface and will hide when the fish turns its back.
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function updateSpoilageDisplay(bodyDE, eyeDE) {
            const bEl = document.getElementById('bellySpot');
            const eEl = document.getElementById('eyeSpot');

            // Logic for Body/Belly Glow
            if (bodyDE > 6) {
                bEl.style.opacity = "0.7";
                bEl.style.backgroundColor = "red";
                bEl.style.boxShadow = "0 0 30px red";
            } else if (bodyDE > 3.5) {
                bEl.style.opacity = "0.5";
                bEl.style.backgroundColor = "orange";
                bEl.style.boxShadow = "0 0 20px orange";
            } else { bEl.style.opacity = "0"; }

            // Logic for Eye Glow
            if (eyeDE > 10) {
                eEl.style.opacity = "0.8";
                eEl.style.backgroundColor = "red";
                eEl.style.boxShadow = "0 0 15px red";
            } else if (eyeDE > 5) {
                eEl.style.opacity = "0.5";
                eEl.style.backgroundColor = "orange";
            } else { eEl.style.opacity = "0"; }
        }

        onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('bodyVal').textContent = (data.bodyDeltaE_max || 0).toFixed(2);
                document.getElementById('eyeVal').textContent = (data.eyeDeltaE_max || 0).toFixed(2);
                updateSpoilageDisplay(data.bodyDeltaE_max || 0, data.eyeDeltaE_max || 0);
            }
        });
    </script>
</body>
</html>
