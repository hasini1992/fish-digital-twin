<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fish Coordinate Finder</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #ui-panel {
            background: #2c3e50;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            border: 2px solid #3498db;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .code-output {
            background: #000;
            color: #00ff00;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            border-radius: 5px;
            word-break: break-all;
            font-size: 0.9em;
        }

        .fish-view {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: #fff;
            border-radius: 15px;
            cursor: crosshair;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2 style="color:#3498db">Coordinate Finder</h2>
        <p style="font-size: 0.85em; margin-bottom: 10px;">Click anywhere on the white fish below:</p>
        
        <div id="status" style="color: #f1c40f; margin-bottom: 5px;">Status: Waiting for click...</div>
        
        <div class="code-output" id="outPos">data-position="pending..."</div>
        <div class="code-output" id="outNorm">data-normal="pending..."</div>
    </div>

    <div class="fish-view">
        <model-viewer 
            id="viewer"
            src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
            camera-controls
            touch-action="none"
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script type="module">
        const viewer = document.querySelector('#viewer');
        const status = document.querySelector('#status');
        const outPos = document.querySelector('#outPos');
        const outNorm = document.querySelector('#outNorm');

        // We use pointerdown to catch the click before rotation starts
        viewer.addEventListener('pointerdown', (event) => {
            const hit = viewer.positionAndNormalFromPoint(event.clientX, event.clientY);
            
            if (hit) {
                const p = hit.position;
                const n = hit.normal;
                
                // Format strings exactly for your HTML
                const posStr = `data-position="${p.x.toFixed(4)}m ${p.y.toFixed(4)}m ${p.z.toFixed(4)}m"`;
                const normStr = `data-normal="${n.x.toFixed(4)}m ${n.y.toFixed(4)}m ${n.z.toFixed(4)}m"`;

                status.innerText = "✅ Successfully captured coordinates!";
                status.style.color = "#2ecc71";
                
                outPos.innerText = posStr;
                outNorm.innerText = normStr;
            } else {
                status.innerText = "❌ Missed! Click closer to the center of the fish.";
                status.style.color = "#e74c3c";
            }
        });
    </script>
</body>
</html>
