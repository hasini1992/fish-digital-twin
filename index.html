<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Quality Monitoring</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        #forceTestBtn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #ff4757;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #forceTestBtn:active { transform: scale(0.95); }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }
        .model-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fish-container {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 15px;
            background: #FFFFFF;
            border: 2px solid #e0e0e0;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        .color-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            width: 100%;
            text-align: center;
        }
        .color-info h4 { margin-bottom: 10px; color: #333; }
        .color-indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .indicator-box {
            padding: 10px;
            border-radius: 8px;
            background: white;
            border: 2px solid #ddd;
        }
        .indicator-label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .indicator-value { font-weight: bold; font-size: 1.1em; }
        .color-scale {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            height: 30px;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .scale-segment {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65em;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .status-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .badge-stable { background: #4CAF50; color: white; }
        .badge-critical { background: #f44336; color: white; animation: badgePulse 2s infinite; }
        @keyframes badgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .metric:last-child { border-bottom: none; }
        .metric-label { font-weight: 600; color: #555; }
        .metric-value { font-weight: bold; font-size: 1.2em; }
        .metric-value.critical { color: #f44336; }
        .metric-value.good { color: #4CAF50; }
        .quality-stars { color: #FFC107; font-size: 1.5em; }
        .alert-box {
            background: #f8d7da;
            border: 2px solid #f44336;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .alert-box strong { color: #721c24; }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }
        @media (max-width: 768px) {
            .content { grid-template-columns: 1fr; }
            .fish-container { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 Fish Digital Twin</h1>
            <p>Real-time Quality Monitoring - Color-Coded Spoilage Detection</p>
            <button id="forceTestBtn">🚨 NUKE TEST: TURN EVERYTHING RED 🚨</button>
        </div>

        <div id="loading" class="loading">Loading fish data...</div>

        <div id="mainContent" class="content" style="display: none;">
            <div class="model-section">
                <div class="fish-container">
                    <model-viewer 
                        id="fishModel"
                        src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                        alt="Fish 3D Model"
                        auto-rotate 
                        camera-controls
                        shadow-intensity="0.5"
                        camera-orbit="0deg 75deg 105%"
                        exposure="1.2">
                    </model-viewer>
                </div>
                
                <div class="color-info">
                    <h4>🎨 Spoilage Indicators</h4>
                    <div class="color-indicators">
                        <div class="indicator-box">
                            <div class="indicator-label">Body Color</div>
                            <div id="bodyColorName" class="indicator-value">--</div>
                            <div style="font-size: 0.8em; color: #666; margin-top: 5px;">
                                ΔE: <strong id="bodyDEDisplay">--</strong>
                            </div>
                        </div>
                        <div class="indicator-box">
                            <div class="indicator-label">Eye Clarity</div>
                            <div id="eyeColorName" class="indicator-value">--</div>
                            <div style="font-size: 0.8em; color: #666; margin-top: 5px;">
                                ΔE: <strong id="eyeDEDisplay">--</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="status-card">
                    <div id="statusBadge" class="status-badge">Loading...</div>
                    <h2 id="fishId">Fish ID</h2>
                    <p id="species"></p>
                </div>

                <div class="status-card">
                    <h3>Quality Analysis</h3>
                    <div class="metric">
                        <span class="metric-label">Quality Score</span>
                        <span id="qualityScore" class="metric-value quality-stars"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Body ΔE (Color Change)</span>
                        <span id="bodyDE" class="metric-value"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Eye ΔE (Clarity Loss)</span>
                        <span id="eyeDE" class="metric-value"></span>
                    </div>
                </div>

                <div id="alertBox" class="alert-box" style="display: none;">
                    <strong>⚠️ CRITICAL SPOILAGE DETECTED</strong>
                    <p id="alertMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- THE NUKE TEST ---
        document.getElementById('forceTestBtn').addEventListener('click', async () => {
            const modelViewer = document.getElementById('fishModel');
            if (!modelViewer.model) return alert("Wait for model to load!");

            let count = 0;
            // Target EVERY single material inside the 3D file
            for (const material of modelViewer.model.materials) {
                // Strip texture
                if (material.pbrMetallicRoughness.baseColorTexture) {
                    try { material.pbrMetallicRoughness.baseColorTexture.setTexture(null); } catch(e){}
                }
                // Apply pure Red
                material.pbrMetallicRoughness.setBaseColorFactor([1, 0, 0, 1]);
                count++;
            }
            alert(`Just attempted to paint all ${count} materials RED. \n\nDid the fish change color?`);
        });

        // Firebase logic
        const fishRef = ref(db, `fishes/WHOLE-FISH-001`);
        onValue(fishRef, (snapshot) => {
            document.getElementById('loading').style.display = 'none';
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('mainContent').style.display = 'grid';
                document.getElementById('fishId').textContent = 'WHOLE-FISH-001';
                document.getElementById('species').textContent = data.species || 'Unknown Species';
                
                document.getElementById('statusBadge').textContent = data.spoilageStatus || 'UNKNOWN';
                document.getElementById('statusBadge').className = `status-badge badge-${(data.spoilageStatus || 'UNKNOWN').toLowerCase()}`;
                
                const bodyDE = data.bodyDeltaE_max || 0;
                const eyeDE = data.eyeDeltaE_max || 0;
                
                document.getElementById('bodyDE').textContent = bodyDE.toFixed(2);
                document.getElementById('eyeDE').textContent = eyeDE.toFixed(2);
                
                if (data.spoilageStatus === 'CRITICAL') {
                    document.getElementById('alertBox').style.display = 'block';
                    document.getElementById('alertMessage').innerHTML = `Body ΔE: ${bodyDE.toFixed(2)} <br> Eye ΔE: ${eyeDE.toFixed(2)}`;
                }
            }
        });
    </script>
</body>
</html>
