<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Manual Alignment</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            color: #333;
        }

        .fish-view {
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            position: relative;
        }

        model-viewer { width: 100%; height: 100%; }

        /* HOTSPOT GLOW */
        .Hotspot { background: transparent; border: none; }
        .glow {
            width: 80px;
            height: 40px;
            background: rgba(255, 0, 0, 0.6);
            border-radius: 50%;
            filter: blur(10px);
            box-shadow: 0 0 20px red;
            transform: translate(-50%, -50%);
        }

        .adjustment-panel {
            padding: 20px;
            background: #2d3436;
            color: white;
        }

        .slider-group { margin-bottom: 15px; }
        input[type=range] { width: 100%; margin: 10px 0; }
        .coord-readout { font-family: monospace; color: #00ff00; background: #000; padding: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="fish-view">
            <model-viewer id="viewer" src="https://hasini1992.github.io/fish-digital-twin/fish.glb" camera-controls shadow-intensity="1">
                <button class="Hotspot" id="tempHotspot" slot="hotspot-test" data-position="0m 0m 0m" data-normal="0m 1m 0m">
                    <div class="glow"></div>
                </button>
            </model-viewer>
        </div>

        <div class="adjustment-panel">
            <h3>🛠️ Manual Alignment Tool</h3>
            <p>Move the sliders to position the spoilage mark on the fish.</p>
            
            <div class="slider-group">
                <label>Left/Right (X-axis):</label>
                <input type="range" id="posX" min="-0.5" max="0.5" step="0.001" value="0">
            </div>
            
            <div class="slider-group">
                <label>Up/Down (Y-axis):</label>
                <input type="range" id="posY" min="-0.2" max="0.2" step="0.001" value="0">
            </div>

            <div class="slider-group">
                <label>Front/Back (Z-axis):</label>
                <input type="range" id="posZ" min="-0.1" max="0.1" step="0.001" value="0.05">
            </div>

            <div class="code-output">
                Current Position: <span class="coord-readout" id="finalCoords">data-position="0m 0m 0.05m"</span>
            </div>
        </div>
    </div>

    <script type="module">
        const viewer = document.querySelector('#viewer');
        const hotspot = document.querySelector('#tempHotspot');
        const finalCoords = document.querySelector('#finalCoords');

        const sliders = {
            x: document.querySelector('#posX'),
            y: document.querySelector('#posY'),
            z: document.querySelector('#posZ')
        };

        function updatePosition() {
            const pos = `${sliders.x.value}m ${sliders.y.value}m ${sliders.z.value}m`;
            hotspot.setAttribute('data-position', pos);
            finalCoords.innerText = `data-position="${pos}"`;
        }

        // Listen for slider changes
        sliders.x.addEventListener('input', updatePosition);
        sliders.y.addEventListener('input', updatePosition);
        sliders.z.addEventListener('input', updatePosition);
    </script>
</body>
</html>
