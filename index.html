<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Research Dashboard</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #818cf8;
            --critical: #ff4d4d;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --panel-border: #334155;
        }

        /* Essential for mobile scrolling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            overflow-x: auto; /* Allows left-right scroll */
            overflow-y: auto; /* Allows up-down scroll */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }

        .dashboard {
            width: 100%;
            max-width: 1300px;
            min-width: 360px; /* Prevents squishing on small phones */
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            margin: 10px auto;
        }

        /* HEADER */
        .header {
            background: #1e293b;
            border-bottom: 4px solid var(--accent);
            display: flex;
            align-items: center;
            padding: 20px 30px;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 800;
        }

        .status-pill {
            background: rgba(255, 77, 77, 0.2);
            border: 3px solid var(--critical);
            color: var(--critical);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.4rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* MAIN AREA: GRID FOR PC, STACK FOR MOBILE */
        .main {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            background: var(--panel-border);
            gap: 2px;
        }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.6rem; }
            .status-pill { font-size: 1.1rem; }
        }

        /* 3D VIEWER CONTAINER */
        .viewer-container {
            background: #000;
            position: relative;
            min-height: 400px;
        }

        @media (min-width: 901px) {
            .viewer-container { height: 750px; }
        }

        model-viewer { width: 100%; height: 100%; }

        /* ANALYTICS DATA */
        .data-panel {
            background: var(--card-bg);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section-title {
            font-size: 1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .stars {
            font-size: 4rem;
            display: flex;
            gap: 10px;
            margin-top: -10px;
        }
        .star-on { color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .star-off { color: #334155; }

        .metric-group { display: flex; flex-direction: column; gap: 15px; }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--panel-border);
        }

        .metric-label { font-size: 1.1rem; color: var(--muted); font-weight: 600; }
        .metric-value { 
            font-family: 'Consolas', monospace; 
            font-weight: 800; 
            font-size: 1.8rem; 
            color: var(--critical); 
        }

        /* DECISION LOGIC */
        .decision-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

        .decision-item {
            padding: 15px 25px;
            border-radius: 12px;
            background: #0f172a;
            border: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #475569;
        }

        .decision-item.active {
            border-color: var(--critical);
            background: rgba(255, 77, 77, 0.05);
            color: var(--text);
        }

        .check-mark { color: var(--critical); font-size: 2rem; }

        .footer-info {
            font-size: 1rem;
            color: var(--muted);
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header class="header">
        <h1>Fish Digital Twin</h1>
        <div class="status-pill">STATUS: CRITICAL</div>
    </header>

    <main class="main">
        <section class="viewer-container">
            <model-viewer 
                id="fishModel"
                src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                auto-rotate 
                camera-controls 
                shadow-intensity="1.5"
                exposure="1.3">
            </model-viewer>
        </section>

        <section class="data-panel">
            <div>
                <p class="section-title">Quality Ranking Index</p>
                <div class="stars">
                    <span class="star-on">★</span><span class="star-off">★</span><span class="star-off">★</span><span class="star-off">★</span><span class="star-off">★</span>
                </div>
            </div>

            <div>
                <p class="section-title">Spectral Spoilage Analysis</p>
                <div class="metric-group">
                    <div class="metric-item">
                        <span class="metric-label">BODY ΔE MAX</span>
                        <span class="metric-value" id="bodyVal">18.49</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">EYE ΔE MAX</span>
                        <span class="metric-value" id="eyeVal">54.18</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">PEAK VARIANCE</span>
                        <span class="metric-value" id="peakVal">1524.4</span>
                    </div>
                </div>
            </div>

            <div>
                <p class="section-title">Post-Analysis Action</p>
                <ul class="decision-list">
                    <li class="decision-item">1. SELL</li>
                    <li class="decision-item">2. HOLD</li>
                    <li class="decision-item active">3. DISCARD <span class="check-mark">✔</span></li>
                </ul>
            </div>

            <div class="footer-info">
                <strong>Doctoral Research:</strong> Agricultural Robotics Lab.<br>
                University of Tsukuba, 2026.
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const viewer = document.getElementById('fishModel');
    
    // MODEL LINKS
    const MODEL_FRESH = "https://hasini1992.github.io/fish-digital-twin/fish.glb";
    const MODEL_SPOILED = "https://hasini1992.github.io/fish-digital-twin/fish_more_red.glb";

    onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            const de = data.bodyDeltaE_max || 18.49;
            
            // Text values
            document.getElementById('bodyVal').textContent = de.toFixed(2);
            document.getElementById('eyeVal').textContent = (data.eyeDeltaE_max || 54.18).toFixed(2);
            document.getElementById('peakVal').textContent = (data.thermalVariance || 1524.4).toFixed(1);

            // Responsive Swapping Logic
            if (de > 6.0) {
                if (viewer.src !== MODEL_SPOILED) {
                    viewer.src = MODEL_SPOILED;
                }
            } else {
                if (viewer.src !== MODEL_FRESH) {
                    viewer.src = MODEL_FRESH;
                }
            }
        }
    });
</script>

</body>
</html>
