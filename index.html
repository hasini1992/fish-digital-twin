<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Fixed Quality Monitoring</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1100px; width: 100%; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; text-align: center; }
        .content { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 30px; }
        .fish-container { position: relative; width: 100%; height: 450px; background: #FFFFFF; border: 2px solid #e0e0e0; border-radius: 15px; }
        model-viewer { width: 100%; height: 100%; }

        /* --- FIXED 3D HOTSPOT STYLING --- */
        .Hotspot { background: transparent; border: none; pointer-events: none; }
        .spot-indicator { border-radius: 50%; transition: opacity 0.8s ease, background-color 0.8s ease; opacity: 0; filter: blur(6px); }
        
        /* Belly spot: Anchored to side/bottom */
        #bellySpot { width: 130px; height: 60px; transform: translate(-50%, -50%); }
        /* Eye spot: Small circle anchored to head */
        #eyeSpot { width: 25px; height: 25px; transform: translate(-50%, -50%); }

        .status-card { background: #f8f9fa; padding: 18px; border-radius: 10px; border-left: 5px solid #667eea; margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 6px 18px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; }
        .badge-critical { background: #f44336; color: white; animation: pulse 2s infinite; }
        .badge-stable { background: #4CAF50; color: white; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .metric { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .metric-value { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 Fish Digital Twin</h1>
            <p>Real-time Spoilage Monitoring - Fixed 3D Anchoring</p>
        </div>

        <div id="loading" style="text-align:center; padding: 50px;">Loading Fish Data...</div>

        <div id="mainContent" class="content" style="display: none;">
            <div class="model-section">
                <div class="fish-container">
                    <model-viewer 
                        id="fishModel"
                        src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                        auto-rotate camera-controls shadow-intensity="0.6">
                        
                        <!-- FIXED BELLY PIN -->
                        <button class="Hotspot" slot="hotspot-belly" 
                            data-position="0.02m -0.05m 0.04m" 
                            data-normal="0m 0m 1m">
                            <div class="spot-indicator" id="bellySpot"></div>
                        </button>
                        
                        <!-- FIXED EYE PIN -->
                        <button class="Hotspot" slot="hotspot-eye" 
                            data-position="0.22m 0.05m 0.015m" 
                            data-normal="1m 0m 0m">
                            <div class="spot-indicator" id="eyeSpot"></div>
                        </button>
                    </model-viewer>
                </div>
            </div>

            <div class="info-section">
                <div class="status-card">
                    <div id="statusBadge" class="status-badge">--</div>
                    <h2 id="fishId">WHOLE-FISH-001</h2>
                    <p id="species">Loading...</p>
                </div>
                <div class="status-card">
                    <div class="metric"><span>Body Delta E</span><span id="bodyVal" class="metric-value">--</span></div>
                    <div class="metric"><span>Eye Delta E</span><span id="eyeVal" class="metric-value">--</span></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function updateSpoilageDisplay(bodyDE, eyeDE, status) {
            const bEl = document.getElementById('bellySpot');
            const eEl = document.getElementById('eyeSpot');

            // Belly Spoilage Logic
            if (bodyDE > 6) {
                bEl.style.opacity = "0.7";
                bEl.style.backgroundColor = "#8B0000"; // Dark Red
                bEl.style.boxShadow = "0 0 35px #8B0000";
            } else if (bodyDE > 3.5) {
                bEl.style.opacity = "0.5";
                bEl.style.backgroundColor = "#ffa500"; // Orange
                bEl.style.boxShadow = "0 0 25px #ffa500";
            } else { bEl.style.opacity = "0"; }

            // Eye Spoilage Logic
            if (eyeDE > 10) {
                eEl.style.opacity = "0.8";
                eEl.style.backgroundColor = "#505050"; // Opaque
                eEl.style.boxShadow = "0 0 15px #505050";
            } else if (eyeDE > 5) {
                eEl.style.opacity = "0.5";
                eEl.style.backgroundColor = "#D3D3D3"; // Cloudy
            } else { eEl.style.opacity = "0"; }

            const badge = document.getElementById('statusBadge');
            badge.textContent = status;
            badge.className = `status-badge badge-${status.toLowerCase()}`;
        }

        onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
            document.getElementById('loading').style.display = 'none';
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('mainContent').style.display = 'grid';
                document.getElementById('species').textContent = data.species || 'Experimental Sample';
                document.getElementById('bodyVal').textContent = (data.bodyDeltaE_max || 0).toFixed(2);
                document.getElementById('eyeVal').textContent = (data.eyeDeltaE_max || 0).toFixed(2);
                updateSpoilageDisplay(data.bodyDeltaE_max || 0, data.eyeDeltaE_max || 0, data.spoilageStatus || 'STABLE');
            }
        });
    </script>
</body>
</html>
