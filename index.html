<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Quality System</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 900px; width: 100%; display: flex; flex-direction: column; overflow: hidden;
        }
        .viewer-box { width: 100%; height: 450px; background: #fff; border-bottom: 1px solid #eee; }
        model-viewer { width: 100%; height: 100%; }
        .info-panel { padding: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid #4a90e2; }
        .label { font-size: 0.8em; color: #666; text-transform: uppercase; }
        .value { font-size: 1.4em; font-weight: bold; color: #333; margin-top: 5px; }
        .status-tag { 
            display: inline-block; padding: 5px 15px; border-radius: 20px; 
            font-weight: bold; font-size: 0.9em; margin-bottom: 10px;
        }
        .critical { background: #ffeef0; color: #d63031; }
        .stable { background: #e3fcef; color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <div class="viewer-box">
        <model-viewer 
            id="fish" 
            src="https://hasini1992.github.io/fish-digital-twin/fish.glb" 
            camera-controls auto-rotate shadow-intensity="1">
        </model-viewer>
    </div>
    
    <div class="info-panel">
        <div class="card">
            <div id="status" class="status-tag">ANALYZING...</div>
            <div class="label">Sample ID</div>
            <div class="value">WHOLE-FISH-001</div>
        </div>
        <div class="card" style="border-left-color: #e67e22;">
            <div class="label">Spoilage Index (Delta E)</div>
            <div id="deValue" class="value">--</div>
            <div id="instruction" style="font-size: 0.75em; color: #888; margin-top: 10px;">
                Fish color tints automatically based on spoilage levels.
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const db = getDatabase(initializeApp({ 
        databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" 
    }));

    async function applyFishTint(bodyDE) {
        const viewer = document.getElementById('fish');
        if (!viewer.model) return;

        const materials = viewer.model.materials;
        
        // Define color based on spoilage
        let tint = [1, 1, 1, 1]; // Default White (Fresh)
        if (bodyDE > 6) {
            tint = [0.8, 0.2, 0.2, 1]; // Deep Red (Spoiled)
        } else if (bodyDE > 3.5) {
            tint = [1, 0.6, 0.2, 1]; // Orange (Warning)
        }

        // Apply to the main body material
        materials.forEach(mat => {
            if (mat.name.toLowerCase().includes('material.001') || mat.name.toLowerCase().includes('body')) {
                mat.pbrMetallicRoughness.setBaseColorFactor(tint);
            }
        });
    }

    onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            const de = data.bodyDeltaE_max || 0;
            
            document.getElementById('deValue').textContent = de.toFixed(2);
            const statusBox = document.getElementById('status');
            statusBox.textContent = data.spoilageStatus;
            statusBox.className = `status-tag ${de > 6 ? 'critical' : 'stable'}`;

            applyFishTint(de);
        }
    });
</script>

</body>
</html>
