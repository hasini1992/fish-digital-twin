<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Material Color System</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .viewer-section { background: #f8fafc; position: relative; height: 500px; }
        model-viewer { width: 100%; height: 100%; }
        
        .info-section { padding: 40px; color: #1e293b; display: flex; flex-direction: column; gap: 20px; }
        .status-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 16px;
            border-left: 6px solid #6366f1;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .val { font-weight: bold; font-family: monospace; font-size: 1.2em; }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            margin-bottom: 10px;
        }
        .critical { background: #fee2e2; color: #ef4444; }
        .stable { background: #dcfce7; color: #22c55e; }
    </style>
</head>
<body>

<div class="container">
    <div class="viewer-section">
        <model-viewer 
            id="fishModel" 
            src="https://hasini1992.github.io/fish-digital-twin/fish.glb" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1">
        </model-viewer>
    </div>

    <div class="info-section">
        <div class="status-card">
            <div id="statusBadge" class="badge">Checking...</div>
            <h2 style="margin-bottom: 5px;">WHOLE-FISH-001</h2>
            <p style="color: #64748b; font-size: 0.9em;">Real-time Spoilage Visualization</p>
        </div>

        <div class="status-card" style="border-left-color: #8b5cf6;">
            <div class="metric">
                <span>Body Delta E</span>
                <span id="bodyVal" class="val">--</span>
            </div>
            <div class="metric">
                <span>Eye Delta E</span>
                <span id="eyeVal" class="val">--</span>
            </div>
        </div>
        
        <p style="font-size: 0.8em; color: #94a3b8; line-height: 1.4;">
            <b>Note:</b> The 3D model's materials are updated dynamically. If spoilage is detected, the fish body and eyes will change color automatically.
        </p>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Helper: Convert Hex to RGB for 3D Engine
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        return [r, g, b, 1.0];
    }

    async function update3DMaterials(bodyDE, eyeDE) {
        const viewer = document.querySelector('#fishModel');
        if (!viewer.model) return;

        const materials = viewer.model.materials;

        // Determine Body Color
        let bodyColor = "#FFFFFF"; // Default White
        if (bodyDE > 6.0) bodyColor = "#ff4d4d"; // Red
        else if (bodyDE > 3.5) bodyColor = "#ffa500"; // Orange

        // Determine Eye Color
        let eyeColor = "#FFFFFF";
        if (eyeDE > 10.0) eyeColor = "#4b4b4b"; // Dark/Cloudy
        else if (eyeDE > 5.0) eyeColor = "#d3d3d3"; // Cloudy

        const bodyRgb = hexToRgb(bodyColor);
        const eyeRgb = hexToRgb(eyeColor);

        materials.forEach(mat => {
            const name = mat.name.toLowerCase();
            // We use the names found in your previous debugging step
            if (name.includes('001') || name.includes('body')) {
                mat.pbrMetallicRoughness.setBaseColorFactor(bodyRgb);
            }
            if (name.includes('002') || name.includes('eye')) {
                mat.pbrMetallicRoughness.setBaseColorFactor(eyeRgb);
            }
        });
    }

    onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            const bodyDE = data.bodyDeltaE_max || 0;
            const eyeDE = data.eyeDeltaE_max || 0;
            const status = data.spoilageStatus || 'STABLE';

            // Update Text UI
            document.getElementById('bodyVal').textContent = bodyDE.toFixed(2);
            document.getElementById('eyeVal').textContent = eyeDE.toFixed(2);
            
            const badge = document.getElementById('statusBadge');
            badge.textContent = status;
            badge.className = `badge ${status.toLowerCase() === 'critical' ? 'critical' : 'stable'}`;

            // Update 3D Model Materials
            update3DMaterials(bodyDE, eyeDE);
        }
    });
</script>

</body>
</html>
