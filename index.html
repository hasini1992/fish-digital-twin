<script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- IMPROVED COORDINATE FINDER ---
        const viewer = document.querySelector('#fishModel');
        
        // We use 'click' but specifically check the model-viewer API
        viewer.addEventListener('click', (event) => {
            const rect = viewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // This core function finds the 3D point on the "skin" of the fish
            const hit = viewer.positionAndNormalFromPoint(x, y);
            
            if (hit) {
                const pos = `${hit.position.x}m ${hit.position.y}m ${hit.position.z}m`;
                const norm = `${hit.normal.x}m ${hit.normal.y}m ${hit.normal.z}m`;

                // 1. Show an alert so you can see it immediately
                alert("COORDINATES FOUND!\n\nPos: " + pos + "\nNorm: " + norm + "\n\nCheck the console (F12) to copy/paste.");

                // 2. Print to console with styling to make it stand out
                console.log("%c --- NEW COORDINATES ---", "background: #222; color: #bada55; font-size: 15px;");
                console.log(`data-position="${pos}"`);
                console.log(`data-normal="${norm}"`);
                console.log("%c ------------------------", "background: #222; color: #bada55; font-size: 15px;");
            } else {
                console.log("Click missed the fish. Try clicking directly on the body.");
            }
        });

        // --- FIREBASE DATA LOGIC ---
        function getColor(de, type) {
            const limit = type === 'eye' ? 10 : 6;
            if (de < 2) return { color: 'transparent', opacity: 0 };
            if (de > limit) return { color: '#ff0000', opacity: 0.7 }; 
            return { color: '#ffa500', opacity: 0.5 }; 
        }

        const fishRef = ref(db, `fishes/WHOLE-FISH-001`);
        onValue(fishRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                const bodyDE = data.bodyDeltaE_max || 0;
                const eyeDE = data.eyeDeltaE_max || 0;

                document.getElementById('bodyVal').textContent = bodyDE.toFixed(2);
                document.getElementById('eyeVal').textContent = eyeDE.toFixed(2);
                
                const bStyle = getColor(bodyDE, 'body');
                const eStyle = getColor(eyeDE, 'eye');

                const bEl = document.getElementById('bellySpot');
                bEl.style.opacity = bStyle.opacity;
                bEl.style.backgroundColor = bStyle.color;
                bEl.style.boxShadow = `0 0 40px ${bStyle.color}`;

                const eEl = document.getElementById('eyeSpot');
                eEl.style.opacity = eStyle.opacity;
                eEl.style.backgroundColor = eStyle.color;
                eEl.style.boxShadow = `0 0 20px ${eStyle.color}`;
            }
        });
    </script>
