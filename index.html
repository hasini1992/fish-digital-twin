<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Quality Monitor</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .model-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        model-viewer {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            background: #f5f5f5;
            transition: filter 0.5s ease;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .badge-stable {
            background: #4CAF50;
            color: white;
        }

        .badge-critical {
            background: #f44336;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 600;
            color: #555;
        }

        .metric-value {
            font-weight: bold;
            font-size: 1.2em;
        }

        .metric-value.critical {
            color: #f44336;
        }

        .metric-value.good {
            color: #4CAF50;
        }

        .quality-stars {
            color: #FFC107;
            font-size: 1.5em;
        }

        .alert-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .alert-box.critical {
            background: #f8d7da;
            border-color: #f44336;
        }

        .qr-section {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            model-viewer {
                height: 400px;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 Fish Digital Twin</h1>
            <p>Real-time Quality Monitoring System</p>
        </div>

        <div id="loading" class="loading">
            Loading fish data...
        </div>

        <div id="mainContent" class="content" style="display: none;">
            <div class="model-section">
                <model-viewer 
                    id="fishModel"
                    src="https://modelviewer.dev/shared-assets/models/Fish.glb"
                    alt="Fish 3D Model"
                    auto-rotate 
                    camera-controls
                    shadow-intensity="1">
                </model-viewer>
                <div class="qr-section">
                    <p><strong>Scan for Mobile Access</strong></p>
                    <div id="qrCode"></div>
                </div>
            </div>

            <div class="info-section">
                <div class="status-card">
                    <div id="statusBadge" class="status-badge">Loading...</div>
                    <h2 id="fishId">Fish ID</h2>
                    <p id="species"></p>
                    <p id="location"></p>
                    <p id="catchDate"></p>
                </div>

                <div class="status-card">
                    <h3>Quality Analysis</h3>
                    <div class="metric">
                        <span class="metric-label">Quality Score</span>
                        <span id="qualityScore" class="metric-value quality-stars"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Body ΔE (Color Change)</span>
                        <span id="bodyDE" class="metric-value"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Eye ΔE (Clarity)</span>
                        <span id="eyeDE" class="metric-value"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Thermal Variance</span>
                        <span id="thermalVar" class="metric-value"></span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Samples Analyzed</span>
                        <span id="samples" class="metric-value"></span>
                    </div>
                </div>

                <div id="alertBox" class="alert-box" style="display: none;">
                    <strong>⚠️ Alert</strong>
                    <p id="alertMessage"></p>
                </div>

                <div class="status-card">
                    <h3>Analysis Details</h3>
                    <p id="analysisType"></p>
                    <p id="segmentation"></p>
                    <p id="lastAnalyzed"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase configuration
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Get fish ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const fishId = urlParams.get('id') || 'WHOLE-FISH-001';

        // Function to update fish color based on ΔE
        function updateFishColor(bodyDE) {
            const model = document.getElementById('fishModel');
            let filterValue;

            if (bodyDE < 2.0) {
                // Fresh - Bright silver
                filterValue = 'brightness(1.2) saturate(1.0)';
            } else if (bodyDE < 3.5) {
                // Good - Normal
                filterValue = 'brightness(1.0) saturate(0.9)';
            } else if (bodyDE < 6.0) {
                // Moderate - Slight discoloration
                filterValue = 'brightness(0.85) saturate(0.7) sepia(0.2)';
            } else if (bodyDE < 10.0) {
                // Poor - Brown tint
                filterValue = 'brightness(0.7) saturate(0.6) sepia(0.4) hue-rotate(20deg)';
            } else {
                // Critical - Dark brown/red (spoiled)
                filterValue = 'brightness(0.5) saturate(1.2) sepia(0.6) hue-rotate(340deg)';
            }

            model.style.filter = filterValue;
        }

        // Function to get quality stars
        function getQualityStars(score) {
            const filled = '⭐'.repeat(score);
            const empty = '☆'.repeat(5 - score);
            return filled + empty;
        }

        // Load fish data
        const fishRef = ref(db, `fishes/${fishId}`);
        
        // Use onValue for real-time updates (no F5 needed!)
        onValue(fishRef, (snapshot) => {
            document.getElementById('loading').style.display = 'none';
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('mainContent').style.display = 'grid';
                
                // Basic info
                document.getElementById('fishId').textContent = fishId;
                document.getElementById('species').textContent = data.species || 'Unknown Species';
                document.getElementById('location').textContent = '📍 ' + (data.location || 'Unknown Location');
                document.getElementById('catchDate').textContent = '📅 Caught: ' + (data.catchDate || 'Unknown');
                
                // Status badge
                const status = data.spoilageStatus || 'UNKNOWN';
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.textContent = status;
                statusBadge.className = `status-badge badge-${status.toLowerCase()}`;
                
                // Quality metrics
                const bodyDE = data.bodyDeltaE_max || 0;
                const eyeDE = data.eyeDeltaE_max || 0;
                const thermalVar = data.thermalVariance || 0;
                const quality = data.qualityScore || 0;
                const samples = data.samplesAnalyzed || 0;
                
                document.getElementById('qualityScore').textContent = getQualityStars(quality);
                
                const bodyDEElement = document.getElementById('bodyDE');
                bodyDEElement.textContent = bodyDE.toFixed(2);
                bodyDEElement.className = 'metric-value ' + (bodyDE > 6.0 ? 'critical' : 'good');
                
                const eyeDEElement = document.getElementById('eyeDE');
                eyeDEElement.textContent = eyeDE.toFixed(2);
                eyeDEElement.className = 'metric-value ' + (eyeDE > 10.0 ? 'critical' : 'good');
                
                document.getElementById('thermalVar').textContent = thermalVar.toFixed(1);
                document.getElementById('samples').textContent = samples;
                
                // Update fish visual based on ΔE
                updateFishColor(bodyDE);
                
                // Alert box for critical fish
                if (status === 'CRITICAL') {
                    const alertBox = document.getElementById('alertBox');
                    alertBox.style.display = 'block';
                    alertBox.className = 'alert-box critical';
                    
                    let reasons = [];
                    if (bodyDE > 6.0) reasons.push(`Body ΔE: ${bodyDE.toFixed(2)} (threshold: 6.0)`);
                    if (eyeDE > 10.0) reasons.push(`Eye ΔE: ${eyeDE.toFixed(2)} (threshold: 10.0)`);
                    if (thermalVar > 480) reasons.push(`Thermal variance: ${thermalVar.toFixed(1)} (threshold: 480)`);
                    
                    document.getElementById('alertMessage').innerHTML = 
                        'CRITICAL spoilage detected:<br>' + reasons.join('<br>');
                }
                
                // Analysis details
                document.getElementById('analysisType').textContent = 
                    '🔬 ' + (data.analysisType || 'Unknown');
                document.getElementById('segmentation').textContent = 
                    '🎯 ' + (data.segmentationMethod || 'Unknown');
                document.getElementById('lastAnalyzed').textContent = 
                    '🕐 Last analyzed: ' + (data.lastAnalyzed || 'Unknown');
                
            } else {
                document.getElementById('loading').textContent = 'Fish not found!';
                document.getElementById('loading').style.display = 'block';
            }
        });
    </script>
</body>
</html>
