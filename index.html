<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Quality Monitoring System</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 1100px; width: 100%; overflow: hidden;
            border: 1px solid #334155;
        }
        .header {
            background: #334155; padding: 25px; text-align: center;
            border-bottom: 3px solid #6366f1;
        }
        .header h1 { font-size: 2em; letter-spacing: 1px; color: #818cf8; }

        .content { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; padding: 30px; }

        .viewer-section {
            background: #000; border-radius: 16px;
            border: 1px solid #475569; height: 500px; position: relative;
        }
        model-viewer { width: 100%; height: 100%; }

        .info-panel { display: flex; flex-direction: column; gap: 20px; }
        .status-card {
            background: #334155; padding: 20px; border-radius: 16px;
            border-left: 6px solid #6366f1;
        }
        .metric-row { 
            display: flex; justify-content: space-between; 
            margin-top: 15px; padding-top: 15px; border-top: 1px solid #475569; 
        }
        .val { font-family: 'Courier New', monospace; font-weight: bold; color: #38bdf8; font-size: 1.3em; }
        .badge {
            display: inline-block; padding: 6px 16px; border-radius: 8px;
            font-size: 0.85em; font-weight: bold; margin-bottom: 10px;
            text-transform: uppercase;
        }
        .critical { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .stable { background: #22c55e; color: white; }
        
        .system-note {
            font-size: 0.8em; color: #94a3b8; line-height: 1.5;
            padding: 10px; border: 1px dashed #475569; border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>QUALITY ANALYSIS ENGINE</h1></div>
    <div class="content">
        
        <div class="viewer-section">
            <model-viewer 
                id="fishModel"
                src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                auto-rotate camera-controls shadow-intensity="1"
                environment-image="neutral" exposure="1.2">
            </model-viewer>
        </div>

        <div class="info-panel">
            <div class="status-card">
                <div id="statusBadge" class="badge">INITIALIZING...</div>
                <h2 style="color: #cbd5e1; margin-bottom: 5px;">SAMPLE: WHOLE-FISH-001</h2>
                <div style="font-size: 0.9em; color: #94a3b8;">Location: University of Tsukuba Lab</div>
            </div>

            <div class="status-card" style="border-left-color: #818cf8;">
                <div class="metric-row">
                    <span>Body Spoilage (ΔE)</span>
                    <span id="bodyVal" class="val">--</span>
                </div>
                <div class="metric-row">
                    <span>Eye Degradation (ΔE)</span>
                    <span id="eyeVal" class="val">--</span>
                </div>
            </div>

            <div class="system-note">
                <b>Visual Sync:</b> The 3D Digital Twin automatically swaps to the high-red spectral model when ΔE exceeds the 6.0 spoilage threshold.
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // Firebase Configuration
    const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const viewer = document.getElementById('fishModel');
    
    // File Paths
    const MODEL_FRESH = "https://hasini1992.github.io/fish-digital-twin/fish.glb";
    const MODEL_SPOILED = "https://hasini1992.github.io/fish-digital-twin/fish_more_red.glb";

    // Listen for Real-time Updates
    onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            const bodyDE = data.bodyDeltaE_max || 0;
            const eyeDE = data.eyeDeltaE_max || 0;
            const status = data.spoilageStatus || 'STABLE';

            // 1. Update Text Metrics
            document.getElementById('bodyVal').textContent = bodyDE.toFixed(2);
            document.getElementById('eyeVal').textContent = eyeDE.toFixed(2);
            
            const badge = document.getElementById('statusBadge');
            badge.textContent = status;
            badge.className = `badge ${status === 'CRITICAL' ? 'critical' : 'stable'}`;

            // 2. SMART MODEL SWAP LOGIC
            // If ΔE > 6.0, switch to the painted model. Otherwise, use fresh.
            if (bodyDE > 6.0) {
                if (viewer.src !== MODEL_SPOILED) {
                    console.log("Switching to Spoiled Model...");
                    viewer.src = MODEL_SPOILED;
                }
            } else {
                if (viewer.src !== MODEL_FRESH) {
                    console.log("Switching to Fresh Model...");
                    viewer.src = MODEL_FRESH;
                }
            }
        }
    });
</script>

</body>
</html>
