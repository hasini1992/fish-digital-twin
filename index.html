<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Digital Twin - Fixed 3D Monitoring</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 1100px; width: 100%; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; text-align: center; }
        .content { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 30px; }
        .fish-container { position: relative; width: 100%; height: 450px; background: #FFFFFF; border: 2px solid #e0e0e0; border-radius: 15px; }
        
        model-viewer { width: 100%; height: 100%; }

        /* --- THE FIXED 3D ANCHOR STYLING --- */
        .Hotspot {
            background: transparent;
            border: none;
            pointer-events: none; /* Crucial: Mouse clicks go THROUGH the dot to rotate the fish */
        }
        
        .spot-glow {
            border-radius: 50%;
            transition: opacity 0.5s ease, background-color 0.5s ease;
            opacity: 0; 
            filter: blur(10px);
            box-shadow: 0 0 25px currentColor;
        }
        
        /* Shape of the spoilage area on the body */
        #bodyGlow { width: 150px; height: 80px; transform: translate(-50%, -50%); }
        /* Shape of the spoilage area on the eye */
        #eyeGlow { width: 30px; height: 30px; transform: translate(-50%, -50%); }

        .info-card { background: #f8f9fa; padding: 20px; border-radius: 12px; border-left: 6px solid #667eea; }
        .metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .metric-value { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐟 Fish Digital Twin</h1>
            <p>Quality Monitoring - Surface-Locked 3D Indicators</p>
        </div>

        <div class="content">
            <div class="model-section">
                <div class="fish-container">
                    <model-viewer 
                        id="fishModel"
                        src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
                        auto-rotate camera-controls shadow-intensity="1">
                        
                        <button class="Hotspot" slot="hotspot-belly" 
                            data-position="0.0m -0.08m 0.06m" 
                            data-normal="0m 0m 1m">
                            <div class="spot-glow" id="bodyGlow"></div>
                        </button>
                        
                        <button class="Hotspot" slot="hotspot-eye" 
                            data-position="0.22m 0.05m 0.02m" 
                            data-normal="1m 0m 0m">
                            <div class="spot-glow" id="eyeGlow"></div>
                        </button>

                    </model-viewer>
                </div>
            </div>

            <div class="info-section">
                <div class="info-card">
                    <h2 id="fishId">WHOLE-FISH-001</h2>
                    <div class="metric">
                        <span>Body Delta E (Color)</span>
                        <span id="bodyVal" class="metric-value">--</span>
                    </div>
                    <div class="metric">
                        <span>Eye Delta E (Clarity)</span>
                        <span id="eyeVal" class="metric-value">--</span>
                    </div>
                </div>
                <p style="margin-top: 20px; color: #666; font-size: 0.9em;">
                    The indicators above are pinned to the 3D surface. Rotate the fish to see them move in sync with the body.
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = { databaseURL: "https://fish-digital-twin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function update3DVisuals(bodyDE, eyeDE) {
            const bodyIndicator = document.getElementById('bodyGlow');
            const eyeIndicator = document.getElementById('eyeGlow');

            // --- Body Spoilage Logic ---
            if (bodyDE > 6) {
                bodyIndicator.style.opacity = "0.7";
                bodyIndicator.style.backgroundColor = "red";
                bodyIndicator.style.color = "red";
            } else if (bodyDE > 3.5) {
                bodyIndicator.style.opacity = "0.5";
                bodyIndicator.style.backgroundColor = "orange";
                bodyIndicator.style.color = "orange";
            } else {
                bodyIndicator.style.opacity = "0";
            }

            // --- Eye Spoilage Logic ---
            if (eyeDE > 10) {
                eyeIndicator.style.opacity = "0.7";
                eyeIndicator.style.backgroundColor = "red";
                eyeIndicator.style.color = "red";
            } else if (eyeDE > 5) {
                eyeIndicator.style.opacity = "0.5";
                eyeIndicator.style.backgroundColor = "orange";
                eyeIndicator.style.color = "orange";
            } else {
                eyeIndicator.style.opacity = "0";
            }
        }

        onValue(ref(db, `fishes/WHOLE-FISH-001`), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('bodyVal').textContent = (data.bodyDeltaE_max || 0).toFixed(2);
                document.getElementById('eyeVal').textContent = (data.eyeDeltaE_max || 0).toFixed(2);
                update3DVisuals(data.bodyDeltaE_max || 0, data.eyeDeltaE_max || 0);
            }
        });
    </script>
</body>
</html>
