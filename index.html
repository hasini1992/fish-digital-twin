<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fish Coordinate Finder</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #ui-panel {
            background: #2c3e50;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            border: 2px solid #3498db;
            text-align: center;
        }

        .code-output {
            background: #000;
            color: #00ff00;
            padding: 12px;
            margin-top: 10px;
            font-family: monospace;
            border-radius: 5px;
            text-align: left;
            user-select: all; /* Easy to copy */
        }

        .fish-view {
            width: 100%;
            max-width: 600px;
            height: 450px;
            background: white;
            border-radius: 15px;
            border: 4px solid #3498db;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        button.active {
            background: #e74c3c;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2>Coordinate Finder</h2>
        <p style="margin-bottom: 15px;">1. Rotate the fish to see the spot you want.<br>
        2. Click the button below to <b>Lock Rotation</b>.<br>
        3. Click the fish to get coordinates.</p>
        
        <button id="lockBtn">🔓 ROTATION: ON</button>
        
        <div class="code-output" id="outPos">data-position="Waiting for click..."</div>
        <div class="code-output" id="outNorm">data-normal="Waiting for click..."</div>
    </div>

    <div class="fish-view">
        <model-viewer 
            id="viewer"
            src="https://hasini1992.github.io/fish-digital-twin/fish.glb"
            camera-controls
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script type="module">
        const viewer = document.querySelector('#viewer');
        const lockBtn = document.querySelector('#lockBtn');
        const outPos = document.querySelector('#outPos');
        const outNorm = document.querySelector('#outNorm');

        let isLocked = false;

        // Toggle Rotation Lock
        lockBtn.addEventListener('click', () => {
            isLocked = !isLocked;
            if (isLocked) {
                viewer.removeAttribute('camera-controls');
                lockBtn.innerText = "🔒 ROTATION: LOCKED";
                lockBtn.classList.add('active');
            } else {
                viewer.setAttribute('camera-controls', '');
                lockBtn.innerText = "🔓 ROTATION: ON";
                lockBtn.classList.remove('active');
            }
        });

        // Capture touch coordinates
        viewer.addEventListener('mousedown', (event) => {
            // Only capture if rotation is locked to prevent "swallowing" the click
            if (!isLocked) return;

            const rect = viewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const hit = viewer.positionAndNormalFromPoint(x, y);
            
            if (hit) {
                outPos.innerText = `data-position="${hit.position.x}m ${hit.position.y}m ${hit.position.z}m"`;
                outNorm.innerText = `data-normal="${hit.normal.x}m ${hit.normal.y}m ${hit.normal.z}m"`;
            }
        });
    </script>
</body>
</html>
